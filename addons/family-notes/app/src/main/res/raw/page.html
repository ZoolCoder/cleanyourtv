<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Notes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: #0b1a12; color: #fff;
         font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #9db8a8; }
  label { display: block; margin: 14px 0 4px; color: #9db8a8; font-size: 15px; }
  input, textarea { width: 100%; padding: 12px; border: 2px solid #16281d; border-radius: 10px;
                    background: #16281d; color: #fff; font: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #2bb673; }
  textarea { min-height: 120px; resize: vertical; }
  button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px;
           background: #2bb673; color: #0b1a12; font: inherit; font-weight: 700; }
  button:disabled { opacity: .6; }
  #msg { margin-top: 16px; min-height: 1.4em; font-weight: 600; }
  #msg.ok { color: #2bb673; } #msg.bad { color: #f2c94c; }
  small { color: #9db8a8; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .quick button { width: auto; margin: 0; padding: 10px 14px; border: 2px solid #20382a; border-radius: 999px;
                  background: #16281d; color: #fff; font-weight: 500; }
  .quick button:active { border-color: #2bb673; }
  #pinok { color: #2bb673; }
</style>
</head>
<body>
<main>
  <h1>Family Notes &middot; ملاحظات العائلة</h1>
  <p class="sub">Send a short note to the TV. &middot; أرسل ملاحظة قصيرة إلى التلفزيون.</p>
  <form id="f" method="post" action="/note" autocomplete="off">
    <label for="name">Your name &middot; اسمك</label>
    <input id="name" name="name" maxlength="24" required dir="auto">
    <label for="text">Note &middot; الملاحظة</label>
    <textarea id="text" name="text" maxlength="280" required dir="auto"></textarea>
    <small id="count">0 / 280</small>
    <div class="quick" id="quick">
      <button type="button">العشاء جاهز</button>
      <button type="button">تعالوا لو سمحتم</button>
      <button type="button">اتصلوا بي</button>
      <button type="button">وقت النوم</button>
      <button type="button">اخفضوا الصوت</button>
      <button type="button">Dinner is ready</button>
      <button type="button">Please come here</button>
      <button type="button">Call me</button>
    </div>
    <label for="pin">PIN shown on the TV &middot; الرمز الظاهر على التلفزيون</label>
    <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
    <small id="pinok" hidden>Filled in from the TV's code. &middot; كُتب من رمز التلفزيون.</small>
    <button id="go" type="submit">Send &middot; إرسال</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script>
(function () {
  var form = document.getElementById("f"), msg = document.getElementById("msg"),
      go = document.getElementById("go"), text = document.getElementById("text"),
      count = document.getElementById("count"), name = document.getElementById("name"),
      pin = document.getElementById("pin"), pinok = document.getElementById("pinok");
  var answers = {
    200: ["ok", "Sent. · تم الإرسال."],
    400: ["bad", "Check the name and note (the note: 280 characters, 4 lines). · تحقق من الاسم والملاحظة."],
    403: ["bad", "Wrong PIN. · الرمز غير صحيح."],
    413: ["bad", "Too long. · طويلة جدًا."],
    429: ["bad", "Too many wrong PINs. Try again in 5 minutes. · محاولات خاطئة كثيرة. حاول بعد 5 دقائق."]
  };
  function show(status) {
    var a = answers[status] || ["bad", "The TV did not accept the note. · لم يقبل التلفزيون الملاحظة."];
    msg.className = a[0];
    // Fixed strings only; nothing typed by the user is ever put on the page.
    msg.textContent = a[1];
  }
  function counted() { count.textContent = text.value.length + " / 280"; }
  function remember(key, value) {
    try { if (value) localStorage.setItem(key, value); else localStorage.removeItem(key); } catch (e) {}
  }
  try { name.value = localStorage.getItem("fn-name") || ""; pin.value = localStorage.getItem("fn-pin") || ""; } catch (e) {}
  // The TV's QR code carries the PIN after the #, which never leaves the phone. Take it, then drop it from the address bar.
  var fromCode = /^#(\d{6})$/.exec(location.hash);
  if (fromCode) {
    pin.value = fromCode[1];
    remember("fn-pin", pin.value);
    history.replaceState(null, "", location.pathname);
  }
  pinok.hidden = !/^\d{6}$/.test(pin.value);
  pin.addEventListener("input", function () { pinok.hidden = true; });
  text.addEventListener("input", counted);
  Array.prototype.forEach.call(document.querySelectorAll("#quick button"), function (b) {
    b.addEventListener("click", function () { text.value = b.textContent; counted(); text.focus(); });
  });
  (name.value ? text : name).focus();
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    go.disabled = true;
    try { localStorage.setItem("fn-name", name.value); } catch (e) {}
    var body = new URLSearchParams(new FormData(form)).toString();
    fetch("/note", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body })
      .then(function (r) {
        show(r.status);
        if (r.status === 200) { text.value = ""; counted(); remember("fn-pin", pin.value); }
        // A wrong PIN means the TV made a new one: forget the old one, so the next scan or typing replaces it.
        if (r.status === 403) { remember("fn-pin", ""); pinok.hidden = true; pin.focus(); }
      })
      .catch(function () { show(0); })
      .then(function () { go.disabled = false; });
  });
})();
</script>
</body>
</html>
